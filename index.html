<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4c5c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Rolê Costa Verde</title>
  </head>
  <body>
    <!-- Tela de entrada (aparece antes de qualquer conteúdo da viagem) -->
    <div id="login-root" hidden></div>

    <!-- App: só é mostrado depois do login -->
    <div id="shell" hidden>
      <aside class="lateral" id="lateral"></aside>

      <header class="topbar">
        <a href="#/inicio" class="brand" aria-label="Rolê Costa Verde"></a>
        <div class="topbar-right">
          <span id="net-badge" class="badge badge-offline" hidden>offline</span>
          <button id="sync-chip" class="sync-chip" type="button" aria-live="polite"></button>
          <span id="trip-pill" class="trip-pill" hidden></span>
          <a href="#/busca" class="icon-btn" id="btn-busca" aria-label="Buscar em tudo"></a>
        </div>
      </header>

      <main id="app"></main>

      <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
